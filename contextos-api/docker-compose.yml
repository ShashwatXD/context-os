version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contextos-postgres
    environment:
      POSTGRES_DB: contextos
      POSTGRES_USER: contextos_user
      POSTGRES_PASSWORD: contextos_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextos_user -d contextos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contextos-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://contextos_user:contextos_password@postgres:5432/contextos
      - ENVIRONMENT=production
      - DEBUG=False
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

