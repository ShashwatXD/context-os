[project]
name = "contextos"
version = "0.1.0"
description = "ContextOS: what happened today, across Gmail, Slack and Discord."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "slack_sdk>=3.30",
    "httpx>=0.27",
    "rich>=13",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
contextos = "contextos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contextos*"]

[tool.setuptools.package-data]
contextos = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
