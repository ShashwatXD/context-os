[project]
name = "contextos"
version = "0.1.0"
description = "ContextOS: a personal briefing of what happened today across Gmail, Slack and Discord."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "slack_sdk>=3.30",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "rich>=13",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
contextos = "contextos.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contextos*", "web*"]

[tool.setuptools.package-data]
web = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 135
target-version = "py311"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "B008"]  # FastAPI uses Depends()/Form() as defaults by design
